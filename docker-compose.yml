services:
  # Local, visual view of everything Orbit.Api logs and traces: http://localhost:18888
  # Orbit.Api sends both structured logs (Serilog OTLP sink) and traces (OpenTelemetry SDK) here,
  # correlated by trace/span id, so a single user click shows up as one connected timeline.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: orbit-aspire-dashboard
    ports:
      - "18888:18888" # dashboard UI
      - "18889:18889" # OTLP gRPC receiver
      - "18890:18890" # OTLP HTTP receiver
    environment:
      # Local prototype only: skips dashboard auth so there's no token to configure.
      # Never set this in a non-local environment.
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"

  # Real Postgres instead of SQLite: a single shared file is what caused a production incident (SQLite's
  # WAL journal mode hanging over a network-mounted volume - see info/azure-setup.md), and running the
  # same engine locally as in production catches provider-specific issues before they ship.
  postgres:
    image: postgres:18-alpine
    container_name: orbit-postgres
    ports:
      - "5432:5432" # published so `dotnet run`/`dotnet watch` outside Docker can reach it too
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-orbit}"
      POSTGRES_USER: "${POSTGRES_USER:-orbit}"
      # Secret - read from the .env file at the repo root (see .env.example), never hardcoded here,
      # same as Jwt__SigningKey below. Port 5432 is published (see the port mapping above) so a stray
      # process on the same network segment could reach it, not just localhost - a fixed, tracked
      # password would be a real credential leak, not a harmless local-only default.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file - see .env.example}"
    volumes:
      # Postgres 18+'s official image expects a single mount at /var/lib/postgresql (not the
      # .../data subdirectory older major versions used) and manages its own versioned subdirectory
      # underneath it - mounting at .../data directly makes the entrypoint refuse to start.
      - orbit-postgres-data:/var/lib/postgresql
    healthcheck:
      # $POSTGRES_USER/$POSTGRES_DB here are read from the container's own environment (set by the
      # official postgres image's entrypoint from the values above), not substituted by Compose -
      # single quotes are deliberate so Compose leaves them alone and the shell inside the container
      # expands them instead. Keeps this in sync if POSTGRES_USER/POSTGRES_DB are ever overridden.
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  orbit-api:
    build:
      context: .
      dockerfile: src/Server/Orbit.Api/Dockerfile
    container_name: orbit-api
    ports:
      - "8081:8080"
    environment:
      # "aspire-dashboard"/"postgres" resolve via Docker's internal DNS; "localhost" here would mean
      # this container itself, not the sibling container.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      # Origin the Blazor client is actually served from in this compose stack (see orbit-web below).
      # Requests through orbit-web's own nginx (see its nginx.conf) are same-origin and never hit this
      # CORS policy at all, since /api/* is proxied under whatever origin the browser already loaded
      # the page from - this only matters for a client that calls Orbit.Api directly from a different
      # origin (e.g. the `dotnet run`/`dotnet watch` dev server). Set WEB_CLIENT_LAN_ORIGIN in .env for
      # that case if needed.
      WebClientOrigins: "http://localhost:8080,${WEB_CLIENT_LAN_ORIGIN:-}"
      ConnectionStrings__Orbit: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-orbit};Username=${POSTGRES_USER:-orbit};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file - see .env.example}"
      # Secret - read from the .env file at the repo root (see .env.example), never hardcoded here.
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in a .env file - see .env.example}"
      # Optional - calendar event reminder emails (see README.md's "Calendar event reminders"
      # section). Left unset, SmtpEmailSender just logs a warning and skips sending.
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__UserName: "${SMTP_USER_NAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__FromAddress: "${SMTP_FROM_ADDRESS:-}"
      # Empty unless Google sign-in is configured - see .env.example.
      GoogleAuth__ClientId: "${GOOGLE_CLIENT_ID:-}"
      GoogleAuth__IosClientId: "${GOOGLE_IOS_CLIENT_ID:-}"
      GoogleAuth__AndroidClientId: "${GOOGLE_ANDROID_CLIENT_ID:-}"
      # Push to the Orbit.Maui apps. This is the path *inside* the container - the key is mounted in
      # rather than baked into the image, from the directory the volume below names. With no key
      # there, FirebasePushNotificationSender logs a warning and drops the push; nothing else breaks.
      Firebase__ServiceAccountKeyPath: "/run/secrets/firebase-service-account.json"
      # Optional - see .env.example. Read directly (not under a "Smtp__"-style prefix) since it's
      # picked up by Azure Monitor's exporter by its own conventional env var name, not app config.
      APPLICATIONINSIGHTS_CONNECTION_STRING: "${APPLICATIONINSIGHTS_CONNECTION_STRING:-}"
      # Optional - push notifications (see README.md's "Push notifications" section). Left unset,
      # VapidPushNotificationSender just logs a warning and skips sending.
      Vapid__PublicKeyBase64Url: "${VAPID_PUBLIC_KEY:-}"
      Vapid__PrivateKeyBase64Url: "${VAPID_PRIVATE_KEY:-}"
      Vapid__Subject: "${VAPID_SUBJECT:-}"
    volumes:
      - orbit-api-logs:/app/logs
      # Read-only, and the whole directory rather than the single file: Docker creates a *directory*
      # in place of a bind source that does not exist, so naming the file would leave a stray one
      # behind on any checkout without a key.
      - ${FIREBASE_SECRETS_DIRECTORY:-./secrets}:/run/secrets:ro
    depends_on:
      aspire-dashboard:
        condition: service_started
      postgres:
        condition: service_healthy

  orbit-web:
    build:
      context: .
      dockerfile: src/Clients/Orbit.Web/Dockerfile
    container_name: orbit-web
    ports:
      # 8443 (HTTPS) is the real, default entry point - see nginx.conf's header comment. 8080 (plain
      # HTTP) stays published only so a stray request there still lands somewhere useful: nginx
      # redirects all of it to 8443, localhost included, so the app only ever runs under one origin -
      # the chat's encryption keys live in per-origin IndexedDB, and two origins would split them.
      - "8080:80"
      - "8443:443"
    environment:
      # Set this to the LAN IP or hostname other devices use to reach this machine (e.g.
      # "192.168.1.50") so the self-signed certificate covers that address - see
      # generate-certificate.sh. Left unset, the certificate only covers "localhost", which isn't
      # reachable from another device.
      TLS_CERTIFICATE_HOSTNAME: "${TLS_CERTIFICATE_HOSTNAME:-localhost}"
      # The Android app's signing certificate, which is what lets a phone open Orbit's own links in
      # the app instead of a browser - see write-android-app-links.sh. Left unset, nothing is served
      # and links open in a browser, which is the ordinary state for a local stack.
      ANDROID_APP_SHA256: "${ANDROID_APP_SHA256:-}"
      # Where the "Debug logs" entry in the avatar menu leads - the two pages of the Aspire dashboard this
      # stack already runs, unless a deployment says otherwise. See write-diagnostics-dashboard.sh.
      DIAGNOSTICS_HISTORY_URL: "${DIAGNOSTICS_HISTORY_URL:-http://localhost:18888/structuredlogs}"
      DIAGNOSTICS_LIVE_URL: "${DIAGNOSTICS_LIVE_URL:-http://localhost:18888/consolelogs}"
    volumes:
      - orbit-web-certs:/etc/nginx/certs
    depends_on:
      orbit-api:
        # Waits for the HEALTHCHECK in Orbit.Api's Dockerfile (GET /health/live) instead of just the
        # container starting, so orbit-web doesn't come up while the API is still initializing.
        condition: service_healthy

volumes:
  orbit-postgres-data:
  orbit-api-logs:
  orbit-web-certs:
