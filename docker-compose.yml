services:
  # Local, visual view of everything Orbit.Api logs and traces: http://localhost:18888
  # Orbit.Api sends both structured logs (Serilog OTLP sink) and traces (OpenTelemetry SDK) here,
  # correlated by trace/span id, so a single user click shows up as one connected timeline.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: orbit-aspire-dashboard
    ports:
      - "18888:18888" # dashboard UI
      - "18889:18889" # OTLP gRPC receiver
      - "18890:18890" # OTLP HTTP receiver
    environment:
      # Local prototype only: skips dashboard auth so there's no token to configure.
      # Never set this in a non-local environment.
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"

  orbit-api:
    build:
      context: .
      dockerfile: src/Server/Orbit.Api/Dockerfile
    container_name: orbit-api
    ports:
      - "8081:8080"
    environment:
      # "aspire-dashboard" resolves via Docker's internal DNS; "localhost" here would mean this
      # container itself, not the dashboard container.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      # Origin the Blazor client is actually served from in this compose stack (see orbit-web below).
      # Requests through orbit-web's own nginx (see its nginx.conf) are same-origin and never hit this
      # CORS policy at all, since /api/* is proxied under whatever origin the browser already loaded
      # the page from - this only matters for a client that calls Orbit.Api directly from a different
      # origin (e.g. the `dotnet run`/`dotnet watch` dev server). Set WEB_CLIENT_LAN_ORIGIN in .env for
      # that case if needed.
      WebClientOrigins: "http://localhost:8080,${WEB_CLIENT_LAN_ORIGIN:-}"
      ConnectionStrings__Orbit: "Data Source=/app/data/orbit.db"
      # Secret - read from the .env file at the repo root (see .env.example), never hardcoded here.
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in a .env file - see .env.example}"
      # Optional - calendar event reminder emails (see README.md's "Calendar event reminders"
      # section). Left unset, SmtpEmailSender just logs a warning and skips sending.
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__UserName: "${SMTP_USER_NAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__FromAddress: "${SMTP_FROM_ADDRESS:-}"
      # Optional - push notifications (see README.md's "Push notifications" section). Left unset,
      # VapidPushNotificationSender just logs a warning and skips sending.
      Vapid__PublicKeyBase64Url: "${VAPID_PUBLIC_KEY:-}"
      Vapid__PrivateKeyBase64Url: "${VAPID_PRIVATE_KEY:-}"
      Vapid__Subject: "${VAPID_SUBJECT:-}"
    volumes:
      # Bind mount instead of a named volume so orbit.db lives at a real path on disk (./data) -
      # point a SQLite client (e.g. Visual Studio's SQLite/SQL Server Compact Toolbox extension) at
      # ./data/orbit.db to browse tables and run queries while the container is running.
      - ./data:/app/data
      - orbit-api-logs:/app/logs
    depends_on:
      - aspire-dashboard

  orbit-web:
    build:
      context: .
      dockerfile: src/Clients/Orbit.Web/Dockerfile
    container_name: orbit-web
    ports:
      # 8443 (HTTPS) is the real, default entry point - see nginx.conf's header comment. 8080 (plain
      # HTTP) stays published only so a stray request there still lands somewhere useful: nginx
      # redirects it to 8443, except for "localhost"/"127.0.0.1", which stay on plain HTTP since they
      # already satisfy the browser's secure-context requirement without it.
      - "8080:80"
      - "8443:443"
    environment:
      # Set this to the LAN IP or hostname other devices use to reach this machine (e.g.
      # "192.168.1.50") so the self-signed certificate covers that address - see
      # generate-certificate.sh. Left unset, the certificate only covers "localhost", which isn't
      # reachable from another device.
      TLS_CERTIFICATE_HOSTNAME: "${TLS_CERTIFICATE_HOSTNAME:-localhost}"
    volumes:
      - orbit-web-certs:/etc/nginx/certs
    depends_on:
      orbit-api:
        # Waits for the HEALTHCHECK in Orbit.Api's Dockerfile (GET /health/live) instead of just the
        # container starting, so orbit-web doesn't come up while the API is still initializing.
        condition: service_healthy

volumes:
  orbit-api-logs:
  orbit-web-certs:
