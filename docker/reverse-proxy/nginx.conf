server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/orbit.crt;
    ssl_certificate_key /etc/nginx/certs/orbit.key;

    # Mirrors orbit-web/nginx.conf's own /api/ proxy location - duplicated here (rather than routing
    # through orbit-web) so an API call only crosses one proxy hop instead of two.
    location /api/ {
        proxy_pass http://orbit-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://orbit-web:80/;
        proxy_set_header Host $host;
    }
}
