# Port 8443 (HTTPS) is Orbit.Web's one and only real entry point - this is what makes browsers treat
# the app as a secure context, which the chat's end-to-end encryption (the Web Crypto API's
# crypto.subtle) requires in order to work at all. Port 8080 only exists so a stray plain-HTTP request
# still ends up somewhere useful - it always redirects to 8443, with no exception for
# "localhost"/"127.0.0.1" even though those hosts already satisfy the browser's secure-context
# requirement without HTTPS. That exception used to be kept for zero-certificate-warning-friction local
# development, but it let the app run under two different origins (http://localhost:8080 and
# https://localhost:8443), and since the chat's E2EE key pair lives in the browser's IndexedDB - which
# is scoped per origin, not shared between them - opening the app under whichever port happened to be
# on hand would silently generate a fresh key pair and orphan every message encrypted under the old one.
# See README.md's "Accessing Orbit.Web from another device on your network" section.

# Whether this request is asking to become a WebSocket. A plain API call sends no Upgrade header and
# must keep its ordinary "Connection: keep-alive"; only a handshake gets "Connection: upgrade". Written
# as a map because $http_upgrade is empty for the former, and passing that through verbatim would send
# a malformed empty Connection header on every ordinary request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The live connection carries its access token in the query string, because a browser cannot put an
# Authorization header on a WebSocket handshake (see Program.cs's OnMessageReceived). nginx's default
# log line contains $request, which includes the query string - so without this, every handshake would
# write a working credential into the access log, where it would sit for as long as logs are kept.
#
# $uri instead of $request_uri for that one path drops the query string and keeps everything else the
# combined format records. Applied by path rather than globally so ordinary requests still log what
# they asked for, which is what makes the logs worth reading.
map $uri $orbit_logged_request {
    ~^/api/live  "$request_method $uri $server_protocol";
    default      "$request_method $request_uri $server_protocol";
}

log_format orbit_combined '$remote_addr - $remote_user [$time_local] "$orbit_logged_request" '
                          '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log orbit_combined;

    ssl_certificate     /etc/nginx/certs/orbit.crt;
    ssl_certificate_key /etc/nginx/certs/orbit.key;

    # A plain-HTTP request landing on this SSL-only listener (e.g. a browser address bar defaulting a
    # bare "localhost:8443" entry to http:// instead of https://) fails the TLS handshake before nginx
    # can even read the request line, which nginx reports internally as error code 497 - without this,
    # that request gets nginx's raw "plain HTTP request sent to HTTPS port" 400 response instead of
    # landing on the app at all. Redirecting it to the https:// version keeps every way of reaching this
    # port working, not just ones that already specified the right scheme.
    error_page 497 =301 https://$host:8443$request_uri;

    include /etc/nginx/snippets/app-locations.conf;
}
