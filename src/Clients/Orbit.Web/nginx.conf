# Port 8443 (HTTPS) is Orbit.Web's real, default entry point - this is what makes browsers treat the
# app as a secure context, which the chat's end-to-end encryption (the Web Crypto API's crypto.subtle)
# requires in order to work at all. Port 8080 only exists so a stray plain-HTTP request still ends up
# somewhere useful - it redirects to 8443, except for "localhost"/"127.0.0.1", which already satisfy
# the browser's secure-context requirement without HTTPS and so are left on plain HTTP with zero
# certificate-warning friction for local development. See README.md's "Accessing Orbit.Web from
# another device on your network" section.
server {
    listen 80;
    server_name _;

    if ($host !~ ^(localhost|127\.0\.0\.1)$) {
        return 301 https://$host:8443$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/app-locations.conf;
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/orbit.crt;
    ssl_certificate_key /etc/nginx/certs/orbit.key;

    # A plain-HTTP request landing on this SSL-only listener (e.g. a browser address bar defaulting a
    # bare "localhost:8443" entry to http:// instead of https://) fails the TLS handshake before nginx
    # can even read the request line, which nginx reports internally as error code 497 - without this,
    # that request gets nginx's raw "plain HTTP request sent to HTTPS port" 400 response instead of
    # landing on the app at all. Redirecting it to the https:// version keeps every way of reaching this
    # port working, not just ones that already specified the right scheme.
    error_page 497 =301 https://$host:8443$request_uri;

    include /etc/nginx/snippets/app-locations.conf;
}
