# Used only for the Azure Container Apps deployment build (see the Dockerfile's NGINX_CONF_FILE build
# arg and .github/workflows/main_orbit.yml) - not by local docker-compose, which uses nginx.conf
# instead. Azure Container Apps ingress terminates TLS itself before forwarding plain HTTP to this
# container, so unlike nginx.conf there is no "listen 443 ssl" server block here, and /api/ is proxied
# to orbit-api's Container App by its own FQDN rather than to a Docker-network hostname.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A server-level `types {}` block replaces the whole MIME map inherited from the base image's
    # mime.types instead of adding to it, which was serving every file (index.html, .js, .dll, ...)
    # as application/octet-stream - the browser then offers to download the page instead of
    # rendering it. Scoping the override to this location keeps the inherited map intact everywhere else.
    location ~ \.wasm$ {
        default_type application/wasm;
    }

    # Reverse-proxies API calls to Orbit.Api under this same origin, so the Blazor client never has to
    # know the API's own host or port (see Program.cs's ApiBaseAddress handling) and no CORS
    # configuration is needed for requests made through this origin - including from another device on
    # the network reaching this container via the host machine's LAN IP.
    location /api/ {
        # orbit-api's Container App ingress always terminates TLS on 443, regardless of the
        # container's actual listening port, so this must be https:// with no port suffix.
        proxy_pass https://orbit-api.internal.politehill-aa37b6da.polandcentral.azurecontainerapps.io/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # The Blazor Router handles client-side routes (e.g. /notes/new) entirely in the browser;
        # anything that isn't a real static file falls back to index.html so the router can take over.
        try_files $uri $uri/ /index.html;
    }
}
