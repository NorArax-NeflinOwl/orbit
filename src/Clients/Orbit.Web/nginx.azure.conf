# Used only for the Azure Container Apps deployment build (see the Dockerfile's NGINX_CONF_FILE build
# arg and .github/workflows/main_orbit.yml) - not by local docker-compose, which uses nginx.conf
# instead. Azure Container Apps ingress terminates TLS itself before forwarding plain HTTP to this
# container, so unlike nginx.conf there is no "listen 443 ssl" server block here, and /api/ is proxied
# to orbit-api's Container App by its own FQDN rather than to a Docker-network hostname.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A server-level `types {}` block replaces the whole MIME map inherited from the base image's
    # mime.types instead of adding to it, which was serving every file (index.html, .js, .dll, ...)
    # as application/octet-stream - the browser then offers to download the page instead of
    # rendering it. Scoping the override to this location keeps the inherited map intact everywhere else.
    location ~ \.wasm$ {
        default_type application/wasm;
    }

    # Reverse-proxies API calls to Orbit.Api under this same origin, so the Blazor client never has to
    # know the API's own host or port (see Program.cs's ApiBaseAddress handling) and no CORS
    # configuration is needed for requests made through this origin - including from another device on
    # the network reaching this container via the host machine's LAN IP.
    location /api/ {
        # A literal (non-variable) host here, resolved through the container's own default DNS at
        # nginx startup - not a custom `resolver` directive pointed at Azure's platform DNS
        # (168.63.129.16). That was tried to dodge stale-IP caching after orbit-api redeploys, but it
        # resolved this hostname to an address that didn't actually route to orbit-api at all - every
        # request came back as Azure's generic "This Container App is stopped or does not exist" page,
        # with nothing ever reaching orbit-api's own logs. The container's built-in DNS (what a plain
        # literal proxy_pass uses) resolves this correctly, matching how it's reached at nginx startup;
        # the tradeoff is a stale IP for the rest of this worker's lifetime after an orbit-api redeploy,
        # until orbit-web itself next restarts.
        #
        # orbit-api's Container App ingress always terminates TLS on 443, regardless of the container's
        # actual listening port, so this must be https:// with no port suffix. A URI is included so
        # nginx does its normal location-prefix replacement, forwarding the full path (e.g.
        # "/api/auth/login") rather than just "/api/" - see the git history of this file for what went
        # wrong when a proxy_pass variable was involved and this URI was silently taken as the literal,
        # final path instead of a prefix to replace.
        proxy_pass https://orbit-api.internal.victorioustree-36ad82ca.polandcentral.azurecontainerapps.io/api/;

        # nginx does NOT send the TLS SNI extension to the upstream by default. Azure Container Apps'
        # internal ingress is a shared endpoint that routes purely by SNI - every internal Container App
        # in the environment sits behind the same internal IP, and without SNI it has no way to tell
        # which one this connection is for, so it just resets the TLS handshake (seen as "peer closed
        # connection in SSL handshake" in this container's own error log). This makes nginx send the
        # upstream's own hostname as SNI, matching what proxy_pass's URL says.
        proxy_ssl_server_name on;

        # Must be orbit-api's own hostname, NOT $host (the browser's original orbit-web hostname).
        # Once SNI got the TLS handshake above working, sending the wrong Host header here made Azure's
        # internal ingress route the plain-HTTP request straight back to orbit-web by that Host header -
        # which re-entered this same /api/ location and proxied to "orbit-api" again with the same wrong
        # Host, forever. Each loop iteration appended to X-Forwarded-For, so it surfaced as nginx
        # eventually failing the request with 400 once the accumulated header grew too large, rather
        # than as an obvious redirect loop.
        proxy_set_header Host orbit-api.internal.victorioustree-36ad82ca.polandcentral.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # The Blazor Router handles client-side routes (e.g. /notes/new) entirely in the browser;
        # anything that isn't a real static file falls back to index.html so the router can take over.
        try_files $uri $uri/ /index.html;
    }
}
