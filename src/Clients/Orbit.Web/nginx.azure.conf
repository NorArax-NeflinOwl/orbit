# Used only for the Azure Container Apps deployment build (see the Dockerfile's NGINX_CONF_FILE build
# arg and .github/workflows/main_orbit.yml) - not by local docker-compose, which uses nginx.conf
# instead. Azure Container Apps ingress terminates TLS itself before forwarding plain HTTP to this
# container, so unlike nginx.conf there is no "listen 443 ssl" server block here, and /api/ is proxied
# to orbit-api's Container App by its own FQDN rather than to a Docker-network hostname.

# Whether this request is asking to become a WebSocket. A plain API call sends no Upgrade header and
# must keep its ordinary "Connection: keep-alive"; only a handshake gets "Connection: upgrade". Written
# as a map because $http_upgrade is empty for the former, and passing that through verbatim would send
# a malformed empty Connection header on every ordinary request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The live connection carries its access token in the query string, because a browser cannot put an
# Authorization header on a WebSocket handshake (see Program.cs's OnMessageReceived). nginx's default
# log line contains $request, which includes the query string - so without this, every handshake would
# write a working credential into the access log, where it would sit for as long as logs are kept.
#
# $uri instead of $request_uri for that one path drops the query string and keeps everything else the
# combined format records. Applied by path rather than globally so ordinary requests still log what
# they asked for, which is what makes the logs worth reading.
map $uri $orbit_logged_request {
    ~^/api/live  "$request_method $uri $server_protocol";
    default      "$request_method $request_uri $server_protocol";
}

# Every request arrives from the Container Apps ingress, so $remote_addr is that ingress's own address
# and identical for everybody - measured, not assumed: the access log showed 100.100.0.124 for every
# request regardless of who made it. Left that way, any per-client limit below would really be one
# shared limit, and the app's own rate limiter partitions anonymous callers by the same address.
#
# real_ip_recursive walks X-Forwarded-For from the right and stops at the first address that is not a
# trusted proxy, which is the correct answer whether the ingress replaces the header or appends to it -
# a client that forges a prefix only adds entries to the left of the real one. If the ingress sends no
# X-Forwarded-For at all, $remote_addr simply stays what it was and nothing here behaves differently
# from before.
set_real_ip_from 100.100.0.0/16;
real_ip_recursive on;

# The forwarded chain is logged because the paragraph above contains the one thing that could not be
# measured from outside: whether the ingress sets this header, and what it puts in it. One look at these
# logs after this ships answers it, and the limits below can then be tightened on evidence.
log_format orbit_combined '$remote_addr - $remote_user [$time_local] "$orbit_logged_request" '
                          '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                          'xff="$http_x_forwarded_for"';

# Two zones, because they answer different questions and the first one cannot be trusted on its own.
#
# orbit_api_client is per caller and is the one that matters: it stops one client - a runaway retry
# loop as much as an attacker - from crowding everybody else out. It is only as good as the address
# above, which is exactly why it is not the only zone here.
#
# orbit_api_all is keyed on a constant, so it is one bucket for the whole installation. That is
# deliberate: if the forwarded address turns out to be absent or forgeable, the per-client zone
# degrades into either one bucket or unlimited buckets, and this is the floor under both cases. It is
# set far above what real use looks like - the access log shows an open browser costing under two
# requests a second - so it is a flood stop, not a throttle anybody should ever meet.
limit_req_zone $binary_remote_addr zone=orbit_api_client:10m rate=15r/s;
limit_req_zone $server_name        zone=orbit_api_all:1m     rate=100r/s;
limit_conn_zone $binary_remote_addr zone=orbit_api_conn:10m;

# 429 rather than nginx's default 503, so a caller that is being throttled is told the same thing by
# the edge and by the application, and a client that already backs off on 429 keeps working.
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log orbit_combined;

    # A server-level `types {}` block replaces the whole MIME map inherited from the base image's
    # mime.types instead of adding to it, which was serving every file (index.html, .js, .dll, ...)
    # as application/octet-stream - the browser then offers to download the page instead of
    # rendering it. Scoping the override to this location keeps the inherited map intact everywhere else.
    location ~ \.wasm$ {
        default_type application/wasm;
    }

    # Reverse-proxies API calls to Orbit.Api under this same origin, so the Blazor client never has to
    # know the API's own host or port (see Program.cs's ApiBaseAddress handling) and no CORS
    # configuration is needed for requests made through this origin - including from another device on
    # the network reaching this container via the host machine's LAN IP.
    # The browser still comes through here even though the phone no longer does: a same-origin /api/ is
    # what keeps the web client free of CORS, and it is the path the deploy is validated end to end on.
    #
    # The upstream is orbit-api's *public* name because its ingress is external now. Whether the
    # .internal name survives that switch is not something to rely on, and the public one works from
    # inside the environment as well as outside, at the cost of a hop back through the ingress.
    location /api/ {
        # A literal (non-variable) host here, resolved through the container's own default DNS at
        # nginx startup - not a custom `resolver` directive pointed at Azure's platform DNS
        # (168.63.129.16). That was tried to dodge stale-IP caching after orbit-api redeploys, but it
        # resolved this hostname to an address that didn't actually route to orbit-api at all - every
        # request came back as Azure's generic "This Container App is stopped or does not exist" page,
        # with nothing ever reaching orbit-api's own logs. The container's built-in DNS (what a plain
        # literal proxy_pass uses) resolves this correctly, matching how it's reached at nginx startup;
        # the tradeoff is a stale IP for the rest of this worker's lifetime after an orbit-api redeploy,
        # until orbit-web itself next restarts.
        #
        # orbit-api's Container App ingress always terminates TLS on 443, regardless of the container's
        # actual listening port, so this must be https:// with no port suffix. A URI is included so
        # nginx does its normal location-prefix replacement, forwarding the full path (e.g.
        # "/api/auth/login") rather than just "/api/" - see the git history of this file for what went
        # wrong when a proxy_pass variable was involved and this URI was silently taken as the literal,
        # final path instead of a prefix to replace.
        proxy_pass https://orbit-api.victorioustree-36ad82ca.polandcentral.azurecontainerapps.io/api/;

        # nginx does NOT send the TLS SNI extension to the upstream by default. Azure Container Apps'
        # internal ingress is a shared endpoint that routes purely by SNI - every internal Container App
        # in the environment sits behind the same internal IP, and without SNI it has no way to tell
        # which one this connection is for, so it just resets the TLS handshake (seen as "peer closed
        # connection in SSL handshake" in this container's own error log). This makes nginx send the
        # upstream's own hostname as SNI, matching what proxy_pass's URL says.
        proxy_ssl_server_name on;

        # Must be orbit-api's own hostname, NOT $host (the browser's original orbit-web hostname).
        # Once SNI got the TLS handshake above working, sending the wrong Host header here made Azure's
        # internal ingress route the plain-HTTP request straight back to orbit-web by that Host header -
        # which re-entered this same /api/ location and proxied to "orbit-api" again with the same wrong
        # Host, forever. Each loop iteration appended to X-Forwarded-For, so it surfaced as nginx
        # eventually failing the request with 400 once the accumulated header grew too large, rather
        # than as an obvious redirect loop.
        proxy_set_header Host orbit-api.victorioustree-36ad82ca.polandcentral.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A WebSocket handshake is an HTTP/1.1 Upgrade, and nginx proxies as HTTP/1.0 unless told otherwise -
        # which strips these headers and turns the upgrade into an ordinary request. SignalR survives that
        # by falling back to long polling, so leaving this out does not break anything visibly: the live
        # connection simply never happens and the app quietly goes on costing what it did before. There is
        # no error to find. See LiveUpdatesHub.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # An idle live connection is normal - nobody is typing most of the time - and the default 60s read
        # timeout would drop it, leaving the client to reconnect every minute for no reason.
        # Both zones apply; a request has to pass each. burst lets an ordinary page load - which fires
        # five or six calls at once - through without delay, while a sustained flood still meets the
        # rate. nodelay serves the burst immediately rather than queuing it, so a legitimate client is
        # never made slower, only a persistent one is refused.
        limit_req zone=orbit_api_client burst=30 nodelay;
        limit_req zone=orbit_api_all    burst=200 nodelay;

        # The live connection is a long-lived WebSocket under this same prefix, so this is a cap on how
        # many a single caller may hold open at once, not on how many exist. Generous: a reader with
        # several tabs and a phone is normal, a hundred is not.
        limit_conn orbit_api_conn 100;

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # The API's own health report, on this origin so a reader can reach it. A footer is where somebody looks
    # when something is wrong, and "is it me or is it the server" is a question the app itself cannot answer
    # once it is the thing that is broken - see MainLayout's Status link.
    #
    # An exact match, so this publishes the report and nothing else under /health. /health/live and
    # /health/ready are the container's own probes and say less than this does; /health/services/{name}
    # fires an outbound probe on demand, which is not something an anonymous caller should be able to ask
    # for. Those three stay reachable only from inside the environment, where the probes run.
    #
    # What the report says is public by decision, not by accident: the status of each check, how long it
    # took, which optional integrations are unconfigured (their key *names*, never values), free disk and
    # the background services' heartbeats. One field would say more than that - external-services reports
    # each configured service's URL - and the list is empty today. Adding a service to it starts publishing
    # that address here; see HealthEndpoints.WriteHealthReportAsync before you do.
    location = /health {
        # The same upstream the /api/ block reaches, and for the same reasons - see the comments there
        # for why this is https:// with no port, why SNI has to be sent, and why the Host header must be
        # the API's own hostname rather than $host.
        proxy_pass https://orbit-api.internal.victorioustree-36ad82ca.polandcentral.azurecontainerapps.io/health;
        proxy_ssl_server_name on;
        proxy_set_header Host orbit-api.internal.victorioustree-36ad82ca.polandcentral.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # The Blazor Router handles client-side routes (e.g. /notes/new) entirely in the browser;
        # anything that isn't a real static file falls back to index.html so the router can take over.
        try_files $uri $uri/ /index.html;
    }
}
