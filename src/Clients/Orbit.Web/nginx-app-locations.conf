# Shared between the plain-HTTP and HTTPS server blocks in nginx.conf, so the actual routing rules
# exist in exactly one place instead of being kept in sync by hand across both.

location ~ \.wasm$ {
    default_type application/wasm;
}

# Reverse-proxies API calls to Orbit.Api under this same origin, so the Blazor client never has to
# know the API's own host or port (see Program.cs's ApiBaseAddress handling) and no CORS
# configuration is needed for requests made through this origin - including from another device on
# the network reaching this container via the host machine's LAN IP.
location /api/ {
    proxy_pass http://orbit-api:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    # The Blazor Router handles client-side routes (e.g. /notes/new) entirely in the browser;
    # anything that isn't a real static file falls back to index.html so the router can take over.
    try_files $uri $uri/ /index.html;
}
