# Shared between the plain-HTTP and HTTPS server blocks in nginx.conf, so the actual routing rules
# exist in exactly one place instead of being kept in sync by hand across both.

location ~ \.wasm$ {
    default_type application/wasm;
}

# Reverse-proxies API calls to Orbit.Api under this same origin, so the Blazor client never has to
# know the API's own host or port (see Program.cs's ApiBaseAddress handling) and no CORS
# configuration is needed for requests made through this origin - including from another device on
# the network reaching this container via the host machine's LAN IP.
location /api/ {
    proxy_pass http://orbit-api:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A WebSocket handshake is an HTTP/1.1 Upgrade, and nginx proxies as HTTP/1.0 unless told otherwise -
    # which strips these headers and turns the upgrade into an ordinary request. SignalR survives that
    # by falling back to long polling, so leaving this out does not break anything visibly: the live
    # connection simply never happens and the app quietly goes on costing what it did before. There is
    # no error to find. See LiveUpdatesHub.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # An idle live connection is normal - nobody is typing most of the time - and the default 60s read
    # timeout would drop it, leaving the client to reconnect every minute for no reason.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# The API's own health report, on this origin so a reader can reach it. A footer is where somebody looks
# when something is wrong, and "is it me or is it the server" is a question the app itself cannot answer
# once it is the thing that is broken - see MainLayout's Status link.
#
# An exact match, so this publishes the report and nothing else under /health. /health/live and
# /health/ready are the container's own probes and say less than this does; /health/services/{name}
# fires an outbound probe on demand, which is not something an anonymous caller should be able to ask
# for. Those three stay reachable only from inside the environment, where the probes run.
#
# What the report says is public by decision, not by accident: the status of each check, how long it
# took, which optional integrations are unconfigured (their key *names*, never values), free disk and
# the background services' heartbeats. One field would say more than that - external-services reports
# each configured service's URL - and the list is empty today. Adding a service to it starts publishing
# that address here; see HealthEndpoints.WriteHealthReportAsync before you do.
location = /health {
    proxy_pass http://orbit-api:8080/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    # The Blazor Router handles client-side routes (e.g. /notes/new) entirely in the browser;
    # anything that isn't a real static file falls back to index.html so the router can take over.
    try_files $uri $uri/ /index.html;
}
