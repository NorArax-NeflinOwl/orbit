<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit</title>
    <base href="/" />
    <!-- First of everything, and a plain classic script: it wraps localStorage so a category this
         reader has declined is never written, and both the inline theme script below and Blazor's own
         token store go through that same wrapper. Anything loaded before it could write past the gate.
         See storageConsent.js, and the Manage cookies dialog in the footer that sets the choice. -->
    <script src="js/storageConsent.js"></script>
    <!-- Resolves and applies the light/dark theme and the chosen accent colour before any CSS paints, so
         the page never flashes the wrong one on load. Mirrors theme.js and accentColor.js (kept in sync
         manually - this one must run as a plain classic script, before app.css, since ES module imports
         and Blazor itself aren't available yet this early). See ThemeService and AccentColorService for
         the interactive (post-load) equivalents. -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('orbit-theme');
                var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
            try {
                var hue = localStorage.getItem('orbit-accent-hue');
                if (hue !== null) {
                    document.documentElement.style.setProperty('--accent-hue', hue);
                }
            } catch (e) {
                // No stored choice, or no storage at all - app.css's own --accent-hue stands.
            }
        })();
    </script>
    <!-- Space Grotesk (headings) + IBM Plex Sans (body/UI) - see app.css's --font-display/--font-body. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
    <link href="css/app.css" rel="stylesheet" />
    <!-- Leaflet: renders the map CalendarEventEditor.razor opens to pick an event's location (see
         wwwroot/js/mapPicker.js). Loaded from a CDN rather than as a NuGet/npm package - it's plain
         JS/CSS with no build step, and Blazor WebAssembly has no built-in mapping component. -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <!-- Loaded first, and as a plain classic script rather than a Blazor-managed one, so its
         window.onerror/unhandledrejection listeners (see clientLogging.js) are registered before
         anything else can fail - including during Blazor's own startup - and keep working even if the
         Blazor app itself crashes. -->
    <script src="js/clientLogging.js"></script>
    <script src="js/viewport.js"></script>
    <script src="js/googleSignIn.js"></script>
    <script src="js/chatScroll.js"></script>

    <div id="app">Loading…</div>

    <div id="blazor-error-ui">
        An unexpected error occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
        <!-- Plain onclick, not a Blazor event handler: this banner is exactly what shows up when the
             Blazor app itself may be in a broken state, so retrieving the diagnostic log must not depend
             on Blazor/JS interop still working. -->
        <a href="#" onclick="OrbitClientLogging.copyLogsToClipboard(this); return false;">Copy error details</a>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
