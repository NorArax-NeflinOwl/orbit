<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- The same mark as the app icon, drawn in the accent on the page ground MauiSplashScreen paints
     behind it - not white on the accent, which is the icon's job. The splash is the moment before the
     first screen, and the first screen is this ground with this mark on it (see the sign-in screen),
     so the app now opens without a colour changing underneath the reader. -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(228 228)">
        <ellipse cx="0" cy="0" rx="193" ry="96" fill="none" stroke="#7260CB" stroke-width="28"
                 transform="rotate(-28)" />
        <circle cx="0" cy="0" r="53" fill="#7260CB" />
    </g>
</svg>
