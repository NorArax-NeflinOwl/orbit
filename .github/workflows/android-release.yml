# Builds an Android APK somebody can install on a phone, and puts it where the download page
# (src/Clients/Orbit.Web/Pages/Download.razor) can point at it.
#
# Runs on its own whenever the phone app changes on main, so what /download offers is the current
# Orbit rather than whatever was last released by hand. Still startable by hand as well, which is how
# a version is chosen deliberately - raising the milestone (0.2 to 0.3, say) is a decision somebody
# makes, not something a push should infer.
#
# A workflow of its own rather than another job in main_orbit.yml, and for a different reason than the
# one at the top of that file: what goes to Azure as a container and what somebody installs on a phone
# are released on different occasions. main_orbit.yml still builds the Android head on every pull
# request; that job answers "does it compile", this one answers "here is the thing to install".
#
# But it does not skip the gate that file argues for. The suite runs here too, in a job this one needs,
# because a green pull request says nothing about the commit that actually landed - and an APK on the
# download page is the one artifact nobody re-checks before installing.
#
# Nothing here fails silently: a missing signing key stops the build rather than producing an unsigned
# APK no phone will install.
name: Release the Android app

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.1.0 - what the app shows and what the version gate compares'
        required: true
        default: '0.1.0'
  push:
    branches:
      - main
    # Everything the APK is built out of, which is more than the two client projects: the app compiles
    # against the same contracts the server serves, and reads its own text out of the shared dictionary,
    # so a change to either produces a different app. Not the web client, not the API's own code - a
    # release for those is a container, and this one would be byte-identical.
    paths:
      - 'src/Clients/Orbit.Maui/**'
      - 'src/Clients/Orbit.Mobile/**'
      - 'src/Shared/Orbit.Contracts/**'
      - 'src/Shared/Orbit.Core/**'
      - 'src/Shared/Orbit.Localization/**'
      - '.github/workflows/android-release.yml'

# Two pushes in quick succession would otherwise race for the one blob the download page points at, and
# whichever finished last would win regardless of which commit it came from. The newer build is always
# the one wanted, so the older run is cancelled rather than queued.
concurrency:
  group: android-release
  cancel-in-progress: true

permissions:
  id-token: write   # required for OIDC login to Azure, for the upload step
  contents: read

env:
  # Where the app looks for Orbit. orbit-web's address rather than orbit-api's: the API has internal
  # ingress only, and orbit-web's nginx is the only way in (see src/Clients/Orbit.Web/nginx.azure.conf).
  # Public, like that file's own hostname, so it lives here rather than in a secret.
  ORBIT_API_BASE_ADDRESS: https://orbit-web.victorioustree-36ad82ca.polandcentral.azurecontainerapps.io/
  # The base of the name. The version is glued on once it is known - see "Decide the version" - so a
  # download says which build it is without anybody opening it.
  APK_BASE_NAME: orbit-android

jobs:
  # The app's own tests, before anything is signed. Narrower than the whole solution on purpose: this
  # fires on a push to main, and main_orbit.yml runs the full suite on that same commit at the same
  # moment - paying for it twice bought nothing but minutes, on an account that ran out of them.
  #
  # What is left is the half that decides whether the APK is worth installing: everything the phone
  # does that a device is not needed to check. A change that breaks the server and not the app fails in
  # the other workflow, where it belongs.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Test the app's own code
        run: dotnet test tests/Orbit.Mobile.Tests/Orbit.Mobile.Tests.csproj --configuration Release

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The whole history, because the version is counted from it - see ci/compute-version.sh.
          fetch-depth: 0

      # A hand-started release is told its version. A push works it out from the history: the build
      # number is the count of days on which a commit landed on main touching the phone's own projects,
      # so a day that changed nothing there raises nothing, two builds of the same commit agree, and
      # nobody maintains a number. See ci/compute-version.sh.
      #
      # The two numbers in front of it are edits to version.props, which are decisions somebody makes on
      # purpose: the move to production, and a milestone.
      - name: Decide the version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(ci/compute-version.sh mobile | head -1 | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          fi

          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # "orbit-android-0_1_32v.apk": dots are not something a download name should carry twice, and the
      # trailing v is what tells the number apart from the rest of the name at a glance.
      - name: Name the APK after the version
        id: apk
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          echo "name=${APK_BASE_NAME}-${VERSION//./_}v.apk" >> "$GITHUB_OUTPUT"

      - name: Say what is being released
        run: echo "Releasing ${{ steps.version.outputs.value }} from ${{ github.sha }}"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android workload
        run: dotnet workload install maui-android

      - name: Install the Android platform the head compiles against
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      # Both files are gitignored because they are a deployment's own business, and both change what the
      # built app can do rather than whether it builds. Restored from secrets so a release has them, and
      # skipped with a line saying so where a secret has not been set.
      #
      # Firebase does nothing for the app yet, and the step is here ahead of the work rather than after
      # it: PhonePushNotifications answers NotAvailableHere on both heads, because obtaining an FCM
      # registration token needs the Firebase SDK referenced in the project and nothing references it.
      # A release built with this file is no more reachable by push than one built without it - see
      # info/orbit-maui-plan.md §4.2 for what is still missing.
      #
      # Which is why nothing about this file may fail the release, a secret holding something that is
      # not base64 included. It did once: the whole run stopped on "base64: invalid input", holding back
      # an APK that would have been identical either way.
      - name: Restore the Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::notice::ANDROID_GOOGLE_SERVICES_JSON_BASE64 is not set. Nothing is lost while the app obtains no FCM token anyway - set it once push is wired up."
            exit 0
          fi

          # Decoded beside the checkout rather than into it, and only copied in once it worked. A failed
          # decode still writes what it managed first, so decoding straight to the destination would
          # leave a truncated google-services.json in the project - which fails the build later, far
          # from the secret that caused it.
          if ! echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > "$RUNNER_TEMP/google-services.json" 2>/dev/null; then
            echo "::warning::ANDROID_GOOGLE_SERVICES_JSON_BASE64 is not base64 - the file's own text pasted in, most likely. Ignored, because the app obtains no FCM token either way. Encode it with 'base64 -w0 google-services.json', or on Windows [Convert]::ToBase64String([IO.File]::ReadAllBytes('google-services.json'))."
            exit 0
          fi

          cp "$RUNNER_TEMP/google-services.json" src/Clients/Orbit.Maui/Platforms/Android/google-services.json

      - name: Restore the Google Maps key
        env:
          MAPS_API_KEY: ${{ secrets.ANDROID_MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::warning::ANDROID_MAPS_API_KEY is not set - the map screen will say it has no map."
            exit 0
          fi
          sed "s|android:value=\"\"|android:value=\"$MAPS_API_KEY\"|" \
            src/Clients/Orbit.Maui/Platforms/Android/AndroidManifestOverlay.xml.example \
            > src/Clients/Orbit.Maui/Platforms/Android/AndroidManifestOverlay.xml

      # An unsigned APK cannot be installed at all, so this is the one restore that stops the run.
      # The keystore is also what Google checks a sign-in against: its SHA-1 has to be registered on the
      # Android OAuth client, or "Continue with Google" comes back refused from a build that is
      # otherwise fine. Keep one key for every release - a new one is a new app to Google and to Android
      # alike, and a phone refuses to update across it.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Make a keystore once with 'keytool -genkeypair -v -keystore orbit-release.jks -alias orbit -keyalg RSA -keysize 2048 -validity 10000', then store it base64-encoded in that secret along with ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/orbit-release.jks"

      # APK rather than the AAB a Release publish defaults to: an AAB is what Google Play accepts and
      # what a phone cannot install. ApplicationVersion is the run number so every release is ordered
      # even when two carry the same display version - Android refuses a build whose version code is
      # not higher than the one already installed.
      - name: Build the signed APK
        run: |
          dotnet publish src/Clients/Orbit.Maui/Orbit.Maui.csproj \
            --framework net10.0-android \
            --configuration Release \
            -p:OrbitApiBaseAddress="$ORBIT_API_BASE_ADDRESS" \
            -p:ApplicationDisplayVersion="${{ steps.version.outputs.value }}" \
            -p:ApplicationVersion="${{ github.run_number }}" \
            -p:InformationalVersion="${{ steps.version.outputs.value }}+${{ steps.version.outputs.commit }}" \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/orbit-release.jks" \
            -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --output "$RUNNER_TEMP/publish"

          # The publish output carries both the signed APK and the unsigned one it was made from, and
          # only one of them installs. Picked by name rather than by taking whichever comes first.
          SIGNED=$(find "$RUNNER_TEMP/publish" -name '*-Signed.apk' | head -1)
          if [ -z "$SIGNED" ]; then
            echo "::error::The publish produced no signed APK. Check the signing secrets above."
            exit 1
          fi
          cp "$SIGNED" "$RUNNER_TEMP/${{ steps.apk.outputs.name }}"

      # Always, so a run is never wasted: whatever else is configured, the APK can be fetched from the
      # run itself. That needs a GitHub account, which is why the upload below exists as well.
      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: orbit-android-${{ steps.version.outputs.value }}
          path: ${{ runner.temp }}/${{ steps.apk.outputs.name }}
          if-no-files-found: error

      # This repository is private, so a release asset here would need a GitHub sign-in to download and
      # the download page could not link to it. Blob storage with anonymous read on one container is
      # what makes a plain link work from a phone. Skipped rather than failed where no container has
      # been configured: the artifact above is still a complete answer for somebody testing alone.
      - name: Log in to Azure
        if: vars.DOWNLOADS_STORAGE_ACCOUNT != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_439F88151FA943D78D4BF8F33E39354D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_94E34BA93C604CA382EDE479DD7DF344 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4D66E98B9B334790B251FF8C8748B1B1 }}

      # Twice, under two names, because they answer different questions.
      #
      # The versioned name is what a download should be called: a file sitting in somebody's Downloads
      # folder says which build it is without anybody opening it.
      #
      # The fixed name is what the download page links to (see Orbit.Web's appsettings.json). That link
      # has to keep working without the page being edited every release, so the newest build is always
      # also published there. Dropping it in favour of the versioned name alone would break the one
      # address the page knows.
      - name: Publish the APK where the download page points
        if: vars.DOWNLOADS_STORAGE_ACCOUNT != ''
        run: |
          for name in "${{ steps.apk.outputs.name }}" "$APK_BASE_NAME.apk"; do
            az storage blob upload \
              --account-name "${{ vars.DOWNLOADS_STORAGE_ACCOUNT }}" \
              --container-name "${{ vars.DOWNLOADS_CONTAINER }}" \
              --name "$name" \
              --file "$RUNNER_TEMP/${{ steps.apk.outputs.name }}" \
              --content-type application/vnd.android.package-archive \
              --auth-mode login \
              --overwrite
            echo "Published to https://${{ vars.DOWNLOADS_STORAGE_ACCOUNT }}.blob.core.windows.net/${{ vars.DOWNLOADS_CONTAINER }}/$name"
          done

      # Telling the server what was just released, which is the half that was missing: the app asks
      # GET /api/config/mobile-version on startup and compares itself against MobileVersion:Android:
      # LatestVersion, so a release nobody records is a release no phone is told about - the update row
      # in the avatar menu simply never lights up.
      #
      # Only LatestVersion, deliberately. MinimumSupportedVersion is the one that *blocks* an app, and
      # while Orbit is a prototype every build should keep working - see MobileVersionPolicy, where the
      # two verdicts are UpdateAvailable and UpdateRequired.
      - name: Tell the server this is the newest Android build
        if: vars.API_CONTAINER_APP_RESOURCE_GROUP != '' && vars.DOWNLOADS_STORAGE_ACCOUNT != ''
        run: |
          # The address as well as the number. Without somewhere to send people, UpdateViewModel leaves
          # its download button disabled (CanUpdate is false on an empty url) - the app would announce an
          # update and then offer no way to get it, which is worse than saying nothing.
          #
          # The fixed name, not the versioned one: this address is stored and read back later, and it has
          # to still point at a build the day after the next release.
          DOWNLOAD_URL="https://${{ vars.DOWNLOADS_STORAGE_ACCOUNT }}.blob.core.windows.net/${{ vars.DOWNLOADS_CONTAINER }}/$APK_BASE_NAME.apk"

          az containerapp update \
            --name orbit-api \
            --resource-group "${{ vars.API_CONTAINER_APP_RESOURCE_GROUP }}" \
            --set-env-vars \
              "MobileVersion__Android__LatestVersion=${{ steps.version.outputs.value }}" \
              "MobileVersion__Android__UpdateUrl=$DOWNLOAD_URL"
          echo "orbit-api now offers ${{ steps.version.outputs.value }} at $DOWNLOAD_URL"

