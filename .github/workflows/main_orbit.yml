# Tests Orbit, then - on main - builds orbit-api and orbit-web images and updates both Azure Container
# Apps to run them. Replaces the previous single-App-Service workflow that Azure Deployment Center
# generated - Orbit is now deployed as two separate containers, matching the local docker-compose
# topology instead of one combined ASP.NET Core app.
#
# One workflow, two jobs, because two workflows could not gate each other. The suite used to run here
# and again in a separate ci.yml, and a red ci.yml did not stop a deploy - it was a report beside the
# pipeline rather than a step in it. Worse, the two drifted: this file asked for "orbit.sln" and ci.yml
# for "Orbit.sln", so three merges built green in one workflow and silently failed to deploy in the
# other (see PR #75). `needs` is a real gate, and one definition cannot disagree with itself.

name: Build, test and deploy Orbit to Azure Container Apps

on:
  push:
    branches:
      - main
  # A pull request runs the test job only - the deploy job is skipped by its own condition below, so a
  # branch is checked without any of it reaching Azure.
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  registryName: orbitcontainerregistry
  registryLoginServer: orbitcontainerregistry.azurecr.io
  resourceGroupName: Orbit

permissions:
  id-token: write   # required for OIDC login to Azure
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      # Orbit.sln, capitalised: the runner's filesystem is case-sensitive and a developer's Mac is not,
      # so a name that is only wrong in its case passes locally and fails only here.
      - name: Restore
        run: dotnet restore Orbit.sln

      - name: Build
        run: dotnet build Orbit.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Orbit.sln --configuration Release --no-build

  deploy:
    # The gate the old arrangement only looked like it had: nothing below runs until the suite is green.
    needs: test
    # Everything from here talks to Azure, so a pull request stops at the job above.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Deliberately NOT targeting a GitHub Environment here (e.g. `environment: production`), tempting
    # as that is for gating deploys behind a manual approval - doing so changes the OIDC token's
    # subject claim from "repo:<org>/<repo>:ref:refs/heads/main" to
    # "repo:<org>/<repo>:environment:<name>", which the federated identity credential configured on
    # the `identity-orbit` Azure AD app registration does not trust, breaking `azure/login` outright
    # for every deploy. Adding that gate back requires updating (or adding a second) federated
    # credential subject on that app registration in Entra ID first - a security-setting change that
    # has to be made deliberately, not as a side effect of editing this file.

    # Gives the smoke-test step below something real to talk to - the same engine production uses
    # (see docker-compose.yml's "postgres" service), not a mock. GitHub Actions waits for this
    # container's own health check before running any step, so the smoke test never races a
    # still-starting database.
    services:
      postgres:
        image: postgres:18-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: orbit
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # OIDC login: Azure exchanges GitHub's short-lived token for an access token. No client secret
      # is ever generated, stored, or rotated. Reuses the same identity (identity-orbit) and secrets
      # Azure Deployment Center originally configured.
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_439F88151FA943D78D4BF8F33E39354D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_94E34BA93C604CA382EDE479DD7DF344 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4D66E98B9B334790B251FF8C8748B1B1 }}

      # A container app with incomplete environment variables "deploys successfully" and then silently
      # degrades: SmtpEmailSender and its siblings deliberately drop work with only a log line when
      # their settings are missing, so production ran without sending a single email and nothing
      # visibly failed. Checking the env var names up front - before spending minutes on image builds -
      # turns that into a failed run naming exactly what to set. Only names can be checked from here
      # (secret values are write-only); empty-but-present values are the "configuration" health
      # check's job at runtime (see ConfigurationHealthCheck in Orbit.Api). When a feature is dropped
      # from this deployment on purpose, remove its variables from this list in the same change.
      - name: Verify orbit-api has every required environment variable
        run: |
          REQUIRED_VARIABLES="
            Jwt__SigningKey
            ConnectionStrings__Orbit
            APPLICATIONINSIGHTS_CONNECTION_STRING
            Vapid__PublicKeyBase64Url
            Vapid__PrivateKeyBase64Url
            Vapid__Subject
            Smtp__Host
            Smtp__Port
            Smtp__UserName
            Smtp__Password
            Smtp__FromAddress
            GoogleAuth__ClientId
            Firebase__ServiceAccountKeyPath
          "
          CONFIGURED_VARIABLES=$(az containerapp show \
            --name orbit-api \
            --resource-group ${{ env.resourceGroupName }} \
            --query "properties.template.containers[0].env[].name" -o tsv)

          missing=""
          for variable in $REQUIRED_VARIABLES; do
            if ! echo "$CONFIGURED_VARIABLES" | grep -qx "$variable"; then
              missing="$missing $variable"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::orbit-api is missing environment variable(s):$missing - set them with 'az containerapp update -n orbit-api -g ${{ env.resourceGroupName }} --set-env-vars ...' (see the settings table in info/azure-setup.md, including which values belong in secrets), or remove deliberately dropped features from the list in this step."
            exit 1
          fi
          echo "orbit-api has every required environment variable."

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.registryName }}

      - name: Build orbit-api image
        run: |
          docker build \
            --file src/Server/Orbit.Api/Dockerfile \
            --tag ${{ env.registryLoginServer }}/orbit-api:${{ github.sha }} \
            --tag ${{ env.registryLoginServer }}/orbit-api:latest \
            --build-arg NGINX_CONF_FILE=nginx.azure.conf \
            .

      - name: Build orbit-web image
        run: |
          docker build \
            --file src/Clients/Orbit.Web/Dockerfile \
            --tag ${{ env.registryLoginServer }}/orbit-web:${{ github.sha }} \
            --tag ${{ env.registryLoginServer }}/orbit-web:latest \
            --build-arg NGINX_CONF_FILE=nginx.azure.conf \
            .

      # Runs the freshly built orbit-api image for real, against a real PostgreSQL, before it ever
      # gets pushed to the registry or deployed - this is what a production incident on 2026-08-23
      # (a migration file that hadn't actually been generated against the Postgres provider) would
      # have been caught by. --network host makes "localhost" inside the container resolve to the
      # runner itself, so it can reach the "postgres" service above the same way the runner's own
      # curl calls do.
      #
      # This validates that the image boots and applies migrations against *a* PostgreSQL - it does
      # NOT validate connectivity to the real Azure Database for PostgreSQL, firewall rules, or the
      # nginx nginx.azure.conf proxy path between orbit-web and orbit-api's real Azure hostname; those
      # are environment-specific and can't be reproduced in this runner. See info/future-plan.md for
      # what a fuller pre-production check of those would take.
      - name: Smoke test orbit-api image against PostgreSQL
        run: |
          docker run -d --name orbit-api-smoke-test \
            --network host \
            -e Jwt__SigningKey="ci-smoke-test-signing-key-do-not-use-elsewhere" \
            -e ConnectionStrings__Orbit="Host=localhost;Port=5432;Database=orbit;Username=orbit;Password=orbit" \
            ${{ env.registryLoginServer }}/orbit-api:${{ github.sha }}

          echo "Waiting for orbit-api to report healthy..."
          healthy=false
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8080/health/ready > /dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done

          echo "--- orbit-api smoke test container logs ---"
          docker logs orbit-api-smoke-test
          docker rm -f orbit-api-smoke-test > /dev/null

          if [ "$healthy" != "true" ]; then
            echo "::error::orbit-api did not report healthy within 90s against a real PostgreSQL - aborting before push/deploy. See the container logs above."
            exit 1
          fi
          echo "orbit-api smoke test passed."

      # Basic sanity check that the built image actually serves something - orbit-web has no database
      # dependency, so this is deliberately lighter than orbit-api's smoke test above. It cannot
      # validate the /api/ proxy path in nginx.azure.conf (that requires orbit-api's real Azure
      # internal FQDN, which doesn't exist outside the deployed environment).
      - name: Smoke test orbit-web image
        run: |
          docker run -d --name orbit-web-smoke-test -p 18080:80 \
            ${{ env.registryLoginServer }}/orbit-web:${{ github.sha }}

          echo "Waiting for orbit-web to serve requests..."
          healthy=false
          for i in $(seq 1 15); do
            if curl -sf http://localhost:18080/ > /dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done

          echo "--- orbit-web smoke test container logs ---"
          docker logs orbit-web-smoke-test
          docker rm -f orbit-web-smoke-test > /dev/null

          if [ "$healthy" != "true" ]; then
            echo "::error::orbit-web did not serve a successful response within 30s - aborting before push/deploy. See the container logs above."
            exit 1
          fi
          echo "orbit-web smoke test passed."

      # Serving a page is not the same as running. nginx answers 200 for every path (it falls back to
      # index.html), so the check above passes even when the client is dead on arrival - which is
      # exactly how a broken build reached production in PR #70. Booting it in a browser is the only
      # thing that tells those two apart from outside.
      - name: Verify the orbit-web image actually boots
        run: |
          docker run -d --name orbit-web-boot-test -p 18081:80 \
            ${{ env.registryLoginServer }}/orbit-web:${{ github.sha }}

          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

          if ! node ci/verify-app-boots.mjs http://localhost:18081/ 60000; then
            echo "--- orbit-web boot test container logs ---"
            docker logs orbit-web-boot-test
            docker rm -f orbit-web-boot-test > /dev/null
            echo "::error::The orbit-web image serves pages but the app does not start - aborting before push/deploy."
            exit 1
          fi

          docker rm -f orbit-web-boot-test > /dev/null

      - name: Push orbit-api image
        run: |
          docker push ${{ env.registryLoginServer }}/orbit-api:${{ github.sha }}
          docker push ${{ env.registryLoginServer }}/orbit-api:latest

      - name: Push orbit-web image
        run: |
          docker push ${{ env.registryLoginServer }}/orbit-web:${{ github.sha }}
          docker push ${{ env.registryLoginServer }}/orbit-web:latest

      # Captured before updating, so a failed health check below can redeploy exactly what was
      # running a moment ago. orbit-api runs in Container Apps' "Single" revision mode, where the
      # newest revision always gets 100% of traffic regardless of its health (see
      # info/azure-setup.md) - re-deploying the previous image is what "rolling back" means here,
      # not a traffic-weight change, which Single mode ignores.
      - name: Capture current orbit-api image (for rollback)
        id: current_api_image
        run: |
          CURRENT_IMAGE=$(az containerapp show \
            --name orbit-api \
            --resource-group ${{ env.resourceGroupName }} \
            --query "properties.template.containers[0].image" -o tsv)
          echo "Current orbit-api image: $CURRENT_IMAGE"
          echo "image=$CURRENT_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Capture current orbit-web image (for rollback)
        id: current_web_image
        run: |
          CURRENT_IMAGE=$(az containerapp show \
            --name orbit-web \
            --resource-group ${{ env.resourceGroupName }} \
            --query "properties.template.containers[0].image" -o tsv)
          echo "Current orbit-web image: $CURRENT_IMAGE"
          echo "image=$CURRENT_IMAGE" >> "$GITHUB_OUTPUT"

      # Points each Container App at the image just built, tagged by commit SHA so the deployed
      # version is always traceable back to the workflow run that produced it. (":latest" is also
      # pushed above for convenience, e.g. manual `az containerapp up` testing, but isn't what gets
      # deployed here.)
      # Permission unlock codes are rows in the database now, made once on the first start that finds
      # them missing and kept afterwards - so there is nothing to generate or inject here, and nothing
      # that changes under whoever was told a code. Read them with:
      #
      #     SELECT "Permission", "Code" FROM "PermissionCodes";
      - name: Deploy orbit-api
        run: |
          az containerapp update \
            --name orbit-api \
            --resource-group ${{ env.resourceGroupName }} \
            --image ${{ env.registryLoginServer }}/orbit-api:${{ github.sha }}

      - name: Deploy orbit-web
        run: |
          az containerapp update \
            --name orbit-web \
            --resource-group ${{ env.resourceGroupName }} \
            --image ${{ env.registryLoginServer }}/orbit-web:${{ github.sha }}

      # Container Apps reports a revision's HealthState based on its own probes independently of
      # whether the deploy command itself succeeded - `az containerapp update` returning 0 only means
      # Azure accepted the new revision, not that it's actually serving traffic correctly (see the
      # incidents documented in info/azure-setup.md, several of which were exactly this: a revision
      # that "deployed successfully" and then never became healthy). Polling here and rolling back
      # automatically is what turns "silently broken in production until a user reports it" into "this
      # workflow run failed, and production is back on the last known-good image."
      - name: Verify orbit-api is healthy, roll back otherwise
        run: |
          NEW_REVISION=$(az containerapp show \
            --name orbit-api \
            --resource-group ${{ env.resourceGroupName }} \
            --query "properties.latestRevisionName" -o tsv)
          echo "Watching orbit-api revision $NEW_REVISION..."

          healthy=false
          for i in $(seq 1 18); do
            STATE=$(az containerapp revision show \
              --name orbit-api \
              --resource-group ${{ env.resourceGroupName }} \
              --revision "$NEW_REVISION" \
              --query "properties.healthState" -o tsv)
            echo "Attempt $i/18: healthState=$STATE"
            if [ "$STATE" = "Healthy" ]; then
              healthy=true
              break
            fi
            sleep 10
          done

          if [ "$healthy" != "true" ]; then
            echo "::error::orbit-api revision $NEW_REVISION did not become healthy within 3 minutes. Rolling back to ${{ steps.current_api_image.outputs.image }}."
            az containerapp update \
              --name orbit-api \
              --resource-group ${{ env.resourceGroupName }} \
              --image "${{ steps.current_api_image.outputs.image }}"
            exit 1
          fi
          echo "orbit-api revision $NEW_REVISION is healthy."

      - name: Verify orbit-web is healthy, roll back otherwise
        run: |
          NEW_REVISION=$(az containerapp show \
            --name orbit-web \
            --resource-group ${{ env.resourceGroupName }} \
            --query "properties.latestRevisionName" -o tsv)
          echo "Watching orbit-web revision $NEW_REVISION..."

          healthy=false
          for i in $(seq 1 18); do
            STATE=$(az containerapp revision show \
              --name orbit-web \
              --resource-group ${{ env.resourceGroupName }} \
              --revision "$NEW_REVISION" \
              --query "properties.healthState" -o tsv)
            echo "Attempt $i/18: healthState=$STATE"
            if [ "$STATE" = "Healthy" ]; then
              healthy=true
              break
            fi
            sleep 10
          done

          if [ "$healthy" != "true" ]; then
            echo "::error::orbit-web revision $NEW_REVISION did not become healthy within 3 minutes. Rolling back to ${{ steps.current_web_image.outputs.image }}."
            az containerapp update \
              --name orbit-web \
              --resource-group ${{ env.resourceGroupName }} \
              --image "${{ steps.current_web_image.outputs.image }}"
            exit 1
          fi
          echo "orbit-web revision $NEW_REVISION is healthy."

      # "Healthy" here means Container Apps' probes are satisfied - which they are, because nginx is
      # serving. It says nothing about whether the app inside the page runs. The deployment that broke
      # production reported Healthy the entire time it was rendering nothing but "Loading…", so this
      # loads the real URL in a browser and rolls back if the app does not start.
      #
      # Retried rather than judged on one attempt: a revision needs a moment to start taking traffic,
      # and rolling production back over a request that arrived too early would be its own outage.
      - name: Verify the deployed app boots, roll back otherwise
        run: |
          APP_URL="https://$(az containerapp show \
            --name orbit-web \
            --resource-group ${{ env.resourceGroupName }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)"
          echo "Booting $APP_URL..."

          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

          booted=false
          for i in $(seq 1 3); do
            echo "Boot attempt $i/3..."
            if node ci/verify-app-boots.mjs "$APP_URL" 60000; then
              booted=true
              break
            fi
            sleep 15
          done

          if [ "$booted" != "true" ]; then
            echo "::error::The deployed app does not start - it serves pages but never renders. Rolling back to ${{ steps.current_web_image.outputs.image }}."
            az containerapp update \
              --name orbit-web \
              --resource-group ${{ env.resourceGroupName }} \
              --image "${{ steps.current_web_image.outputs.image }}"
            exit 1
          fi
          echo "The deployed app boots."
